<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Chat</title>

  <style>
    @font-face {
      font-family: "IBM Plex Sans";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("fonts/ibm-plex-sans-400.ttf") format("truetype");
    }

    @font-face {
      font-family: "IBM Plex Sans";
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url("fonts/ibm-plex-sans-500.ttf") format("truetype");
    }

    @font-face {
      font-family: "IBM Plex Sans";
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url("fonts/ibm-plex-sans-600.ttf") format("truetype");
    }

    :root {
      color-scheme: light;
      --bg: #F8F4F1;
      --surface: #FFFFFF;
      --surface-2: #EEF0F4;
      --ink: #17202B;
      --line: #DCE1E8;
      --bar: #000000;
      --bar-ink: #FFFFFF;
      --blue: #2A67AD;
      --body: "IBM Plex Sans", "Segoe UI", system-ui,
        -apple-system, sans-serif;
      --r: 10px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: auto;
      overflow-y: auto;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding-bottom: 60px;
      display: flex;
      flex-direction: column;
      font-family: var(--body);
      font-size: 15px;
      line-height: 1.55;
      color: var(--ink);
      background: var(--bg);
    }

    button,
    input {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    :focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* Top black bar */
    .top-bar {
      width: 100%;
      height: 52px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      background: var(--bar);
      color: var(--bar-ink);
    }

    .top-bar :focus-visible {
      outline-color: #FFFFFF;
    }

    .home-link {
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      color: #FFFFFF;
    }

    .home-link:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .home-icon {
      display: block;
    }

    .logout-btn {
      min-height: 36px;
      padding: 6px 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #FFFFFF;
      border-radius: 8px;
      background: #FFFFFF;
      color: #000000;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.2;
      text-decoration: none;
    }

    .logout-btn:hover {
      background: var(--surface-2);
      border-color: var(--surface-2);
    }

    /* Logo */
    .logo-row {
      width: 100%;
      padding: 16px 20px 0;
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }

    .logo-row img {
      height: 48px;
      width: auto;
      max-width: 100%;
      display: block;
    }

    /* Chat */
    .chat-panel {
      width: 60%;
      margin: 24px auto 0;
    }

    #log {
      width: 100%;
      height: 300px;
      overflow-y: auto;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--r);
      background: var(--surface);
      font-size: 15px;
      line-height: 1.6;
    }

    #log p {
      margin: 0 0 16px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #log p:last-child {
      margin-bottom: 0;
    }

    #log strong {
      font-weight: 600;
    }

    .chat-form {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .chat-input {
      flex: 1;
      min-width: 0;
      height: 40px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .send-btn {
      height: 40px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #000000;
      border-radius: 8px;
      background: #000000;
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 500;
    }

    .send-btn:not(:disabled):hover {
      background: #222222;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @media (max-width: 700px) {
      .chat-panel {
        width: calc(100% - 32px);
      }

      .logo-row {
        padding-left: 16px;
        padding-right: 16px;
      }

      #log {
        padding: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <header class="top-bar">
    <a class="home-link" href="index.html" aria-label="Home">
      <svg
        class="home-icon"
        viewBox="0 0 24 24"
        width="24"
        height="24"
        aria-hidden="true"
        focusable="false"
      >
        <path
          fill="#FFFFFF"
          d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3L12 3z"
        />
      </svg>
    </a>

    <a class="logout-btn" href="index.html">logout</a>
  </header>

  <div class="logo-row">
    <img src="logo.png" alt="Logo">
  </div>

  <main class="chat-panel">
    <section
      id="log"
      role="log"
      aria-label="Conversation"
      aria-live="polite"
      aria-relevant="additions text"
    ></section>

    <form id="chat-form" class="chat-form" autocomplete="off">
      <input
        id="message"
        class="chat-input"
        type="text"
        name="message"
        aria-label="Message"
        required
      >
      <button id="send" class="send-btn" type="submit">send</button>
    </form>
  </main>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    const messages = [];
    let sending = false;

    function scrollToLatest() {
      $("log").scrollTop = $("log").scrollHeight;
    }

    function line(role, text = "") {
      const paragraph = document.createElement("p");
      const label = document.createElement("strong");
      const span = document.createElement("span");

      label.textContent = `${role}: `;
      span.textContent = text;

      paragraph.append(label, span);
      $("log").append(paragraph);
      scrollToLatest();

      return span;
    }

    $("chat-form").addEventListener("submit", async (event) => {
      event.preventDefault();

      const text = $("message").value.trim();
      if (!text || sending) return;

      sending = true;
      $("message").value = "";
      $("send").disabled = true;

      line("user", text);

      const userMessage = { role: "user", content: text };
      messages.push(userMessage);

      const replySpan = line("bot", "Thinking…");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ messages })
        });

        const raw = await response.text();
        let data;

        try {
          data = JSON.parse(raw);
        } catch {
          throw new Error(
            `/api/chat returned non-JSON (${response.status}): ` +
            raw.slice(0, 120)
          );
        }

        if (!response.ok) {
          throw new Error(
            (typeof data?.error === "string" && data.error) ||
            `Request failed (${response.status}).`
          );
        }

        if (
          typeof data?.reply !== "string" ||
          !data.reply.trim()
        ) {
          throw new Error("The server did not return a valid reply.");
        }

        // Regular chat only: display and save the assistant's reply.
        replySpan.textContent = data.reply;
        messages.push({
          role: "assistant",
          content: data.reply
        });
      } catch (error) {
        replySpan.textContent = `[Error: ${error.message}]`;

        // Do not retain an unanswered message in future API requests.
        if (messages.at(-1) === userMessage) {
          messages.pop();
        }

        // Restore the message for retry unless a new one is being typed.
        if (!$("message").value) {
          $("message").value = text;
        }
      } finally {
        sending = false;
        $("send").disabled = false;
        $("message").focus();
        scrollToLatest();
      }
    });
  </script>
</body>
</html>
